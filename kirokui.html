<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>기록의 결 - 생기부 어시스턴트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* ── Base & Reset ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100vh; margin: 0; padding: 0; }
  body { 
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; 
    background: #FFF8F0; color: #1F2937; line-height: 1.5; word-break: keep-all; 
    overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
  }
  input, textarea, select, button { font-family: inherit; outline: none; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 5px; }
  
  /* ── UI Components ── */
  .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.03); border: 1px solid #FFE4C8; margin-bottom: 12px; }
  .inp { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #E5E7EB; font-size: 14px; background: #F9FAFB; transition: all .2s; }
  .inp:focus { border-color: #F4A261; background: white; }
  
  .btn-primary { padding: 14px 16px; border-radius: 10px; border: none; background: linear-gradient(135deg, #F4A261, #E76F51); color: white; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(231,111,81,.25); transition: all .2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(231,111,81,.35); }
  .btn-primary:disabled { background: #D1D5DB; box-shadow: none; cursor: not-allowed; transform: none; }

  .btn-outline { padding: 10px 14px; border-radius: 8px; border: 1px solid #E5E7EB; background: white; color: #4B5563; font-weight: 700; font-size: 14px; cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
  .btn-outline:hover { background: #F3F4F6; border-color: #D1D5DB; }
  .btn-small { padding: 6px 10px; font-size: 12px; border-radius: 6px; }

  /* ── Tabs & Nav ── */
  .nav-menu { display: flex; background: white; border-bottom: 1px solid #FFE4C8; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 6px rgba(0,0,0,.04); }
  .nav-item { flex: 1; text-align: center; padding: 16px 0; font-weight: 800; font-size: 15px; color: #9CA3AF; cursor: pointer; border-bottom: 3px solid transparent; transition: all .2s; }
  .nav-item.active { color: #E76F51; border-bottom-color: #E76F51; }

  /* ── Tags & Toggles ── */
  .type-btn { padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 13px; cursor: pointer; border: 1px solid transparent; transition: all .2s; flex-shrink: 0; }
  .level-btn { flex: 1; padding: 10px 4px; border-radius: 8px; cursor: pointer; border: 1px solid #E5E7EB; transition: all .2s; background: white; text-align: center; }
  .level-btn.active { border-color: #F4A261; border-width: 2px; background: #FFFBF7; }
  
  .kw-tag { font-size: 13px; padding: 6px 12px; border-radius: 16px; border: 1px dashed #D1D5DB; background: white; color: #4B5563; cursor: pointer; font-weight: 600; transition: all .15s; display: inline-block; margin-right: 6px; margin-bottom: 6px; }
  .kw-tag:hover { background: #FFF3E8; border-color: #F4A261; color: #E76F51; }

  /* ── Lists & Checkboxes ── */
  .stu-row { display: flex; align-items: center; padding: 14px; border-bottom: 1px solid #F3F4F6; transition: background .2s; cursor: pointer; background: white; border-radius: 8px; margin-bottom: 8px; border: 1px solid #F3F4F6; }
  .stu-row:hover { background: #FFFBF7; border-color: #FFE4C8; }
  .stu-row.selected { background: #FFF3E8; border-color: #F4A261; }
  .custom-cb { width: 22px; height: 22px; accent-color: #F4A261; cursor: pointer; margin-right: 14px; flex-shrink: 0; }
  
  .review-card { background: white; border: 1px solid #E5E7EB; border-radius: 14px; padding: 18px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
  .review-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F3F4F6; padding-bottom: 12px; margin-bottom: 4px; }
  .accumulated-tags { display: flex; flex-direction: column; gap: 8px; font-size: 13px; background: #F9FAFB; padding: 14px; border-radius: 10px; border: 1px solid #E5E7EB;}

  /* ── Toasts & Loader ── */
  #toasts-container {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column-reverse; gap: 10px; pointer-events: none; z-index: 9999; width: 90%; max-width: 400px;
  }
  .toast { padding: 14px 20px; border-radius: 10px; font-size: 14px; font-weight: 800; box-shadow: 0 6px 20px rgba(0,0,0,.15); animation: slideIn .3s forwards; display: flex; align-items: center; gap: 10px; background: white; border-left: 5px solid #10B981; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(20px) } to { opacity: 1; transform: translateY(0) } }
  .loader { border: 3px solid #F3F4F6; border-top: 3px solid #F4A261; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  /* ── Views & Layout ── */
  .view-container { display: none; padding: 16px; max-width: 800px; margin: 0 auto; width: 100%; flex-direction: column; flex: 1 0 auto; }
  .view-container.active { display: flex; }
  .layout-wrapper { display: flex; flex-direction: column; width: 100%; }
  
  .list-wrapper { background: white; border-radius: 14px; border: 1px solid #FFE4C8; box-shadow: 0 2px 8px rgba(0,0,0,.03); display: flex; flex-direction: column; margin-bottom: 12px; }
  .list-scroll { max-height: 280px; overflow-y: auto; padding: 14px; background: #FAFAFA; border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; }

  footer { text-align: center; padding: 24px 16px; font-size: 12px; color: #9CA3AF; font-weight: 600; margin-top: auto; border-top: 1px solid #FFE4C8; background: white; flex-shrink: 0; }

  @media (max-width: 768px) {
    header { flex-wrap: nowrap; padding: 12px 16px; }
    .view-container { padding: 16px 12px 30px 12px; }
  }

  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  /* 텍스트 입력창 Placeholder 폰트 스타일링 */
  ::placeholder { color: #9CA3AF; opacity: 1; line-height: 1.6; font-size: 13px; }
</style>
</head>

    if(st) { try { this.students = JSON.parse(st); } catch(e) { this.students = []; } }

    this.ui = { quick: { type: "세특", subject: "사회", level: "상", selectedIds: [] }, review: { type: "세특", grade: "", classNum: "" } };
  },
  save() { localStorage.setItem("ggyul_ai_pro_f27", JSON.stringify(this.students)); }
};
State.getGrades = function() { return [...new Set(this.students.map(s => s.grade))].sort(); };

// ── 2. Gemini API ──
const API = {
  key: "", // 캔버스 환경 자동 주입
  url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent",
  async callGemini(prompt, systemInstruction, schema) {
    const payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemInstruction }] }, generationConfig: { responseMimeType: "application/json", responseSchema: schema } };
    try {
      const res = await fetch(`${this.url}?key=${this.key}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await res.json(); return JSON.parse(data.candidates[0].content.parts[0].text);
    } catch (e) { return null; }
  },
  async combineToFinal(type, recordsText) {
    const sysInst = `너는 교사가 남겨둔 기록들을 바탕으로 생기부 문단(2~4문장)을 작성하는 전문가야. 교사 서술체(~함)를 사용해.`;
    const prompt = `영역: ${type}\n내용:\n${recordsText}`;
    const res = await this.callGemini(prompt, sysInst, { type: "OBJECT", properties: { finalText: { type: "STRING" } } });
    return res ? res.finalText : "";
  },
  async analyzePhoto(base64Data, mimeType) {
    const payload = {
      contents: [{
        parts: [
          { text: "이 이미지는 중/고등학생의 수행평가 또는 학습지 결과물입니다. 다음 3가지 정보를 추출하세요. 1. studentId (상단에 적힌 학번, 숫자로만 표기. 모르면 빈문자열), 2. name (학생 이름. 모르면 빈문자열), 3. summary (별도의 채점 기준표가 없더라도 답변의 논리성, 구체성, 정확성을 바탕으로 스스로 100점 만점 기준 점수 또는 A/B/C 등급을 매겨주세요. 그리고 그 채점 근거와 학생의 성향적 특징, 핵심 요약을 합쳐서 줄글 형태로 2~3문장 작성해주세요.)" },
          { inlineData: { mimeType: mimeType, data: base64Data } }
        ]
      }],
      generationConfig: {
        responseMimeType: "application/json",
        responseSchema: {
          type: "OBJECT",
          properties: {
            studentId: { type: "STRING" },
            name: { type: "STRING" },
            summary: { type: "STRING" }
          }
        }
      }
    };
    try {
      const res = await fetch(`${this.url}?key=${this.key}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await res.json(); return JSON.parse(data.candidates[0].content.parts[0].text);
    } catch (e) { console.error(e); return null; }
  }
};

// ── 4. Main App Logic ──
const App = {
  init() { 
    State.init(); 
    UI.renderGlobalDropdowns();

  checkExternalInbox() { try { return JSON.parse(localStorage.getItem("ggyul_external_inbox") || "[]"); } catch(e) { return []; } },
  renderInboxUI() {
    const inbox = this.checkExternalInbox();
    const container = document.getElementById("external-inbox-container");

    if (!inbox || inbox.length === 0) { if(container) container.style.display = "none"; if(badge) badge.style.display = "none"; return; }

    if(container) {
      container.style.display = "block";
      let html = `<div style="border: 1px solid #BFDBFE; border-left: 4px solid #3B82F6; background: #EFF6FF; padding: 14px; border-radius: 8px;">

                      📡 연동된 수업 앱에서 데이터 도착 (${inbox.length}건)
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 10px;">`;
      
      inbox.forEach(item => {
        html += `
          <div style="background: white; border-radius: 8px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
              <div style="flex:1;">
                <div style="font-size: 11px; color: #6B7280; font-weight: 800; margin-bottom: 4px;">[${item.sourceApp}]</div>

                   <b style="color:#2563EB">${item.studentName}</b> 학생 : <b>${item.keywords}</b>
                </div>
                <div style="margin-top: 6px; display:flex; gap:6px; flex-wrap:wrap;">
                  <span style="font-size:11px; font-weight:800; padding:2px 8px; border-radius:6px; background:#E0E7FF; color:#4338CA;">🎯 ${item.achievement}</span>
                </div>
                <div style="font-size: 12px; color: #4B5563; margin-top: 6px;">${item.memo}</div>

                 <button class="btn-outline" style="padding: 8px 12px; font-size: 12px; color: #9CA3AF; border-color: #E5E7EB;" onclick="App.discardExternalRecord(${item.tempId})">무시</button>

  applyExternalRecord(tempId) {
    let inbox = this.checkExternalInbox(); const target = inbox.find(r => r.tempId === tempId); if(!target) return;
    const st = State.students.find(s => s.name === target.studentName); if(!st) return UI.toast(`명단에 '${target.studentName}' 학생이 없습니다. 먼저 명단에 추가하세요.`, "error");
    if(!st.records) st.records = []; st.records.unshift({ id: generateId(), type: target.type, subject: target.subject, level: target.level, achievement: target.achievement, keywords: `${target.keywords} - ${target.memo}`, date: Date.now() });
    inbox = inbox.filter(r => r.tempId !== tempId); localStorage.setItem("ggyul_external_inbox", JSON.stringify(inbox));
    State.save(); this.renderInboxUI(); UI.renderQuickStudentList(); UI.renderReviewList(); UI.toast(`${st.name} 수업 앱 데이터 반영 완료!`);
  },
  discardExternalRecord(tempId) { let inbox = this.checkExternalInbox(); inbox = inbox.filter(r => r.tempId !== tempId); localStorage.setItem("ggyul_external_inbox", JSON.stringify(inbox)); this.renderInboxUI(); },
  fetchExternalDataSync() {
    const names = ["홍길동", "김철수", "손이진"]; const name = State.students.length > 0 ? State.students[Math.floor(Math.random()*State.students.length)].name : names[Math.floor(Math.random()*3)];
    const newRecord = { 
      tempId: Date.now(), sourceApp: "바나나월드", studentName: name, type: "세특", subject: "사회", 
      achievement: "[9사(지)05-01]", level: "상", keywords: "유럽 지형 퍼즐 완수", memo: "평가점수 98점. 유럽 국가 특징 파악 우수함." 
    };
    let inbox = this.checkExternalInbox(); inbox.push(newRecord); localStorage.setItem("ggyul_external_inbox", JSON.stringify(inbox));
    this.renderInboxUI(); UI.toast("📡 연동된 수업 앱에서 신규 데이터를 수신했습니다.");
  },

  switchTab(tabId) { 
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); 
    document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active')); 
    document.getElementById(`tab-btn-${tabId}`).classList.add('active'); 
    document.getElementById(`view-${tabId}`).classList.add('active');

      UI.renderQuickInput();
      UI.renderQuickStudentList();
    } else {
      UI.renderReviewList();
    }
  },
  setQuickInput(key, val, e) { 
    State.ui.quick[key] = val; 
    if(key==='type'||key==='subject') UI.renderQuickInput(); 
    else if(key==='level') { 
      document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('active')); 
      if(e) e.currentTarget.classList.add('active'); 
    } 
  },
  addKw(kw) { const el = document.getElementById("quick-kw"); if(el) el.value = el.value ? el.value + ", " + kw : kw; },
  toggleQuickStu(id) { const sel = State.ui.quick.selectedIds; sel.includes(id) ? State.ui.quick.selectedIds = sel.filter(i=>i!==id) : sel.push(id); UI.renderQuickStudentList(); },
  toggleAllQuick(checked) { const sts = State.students.filter(s => true); State.ui.quick.selectedIds = checked ? sts.map(s=>s.id) : []; UI.renderQuickStudentList(); },
  
  addQuickRecords() {
    const { type, subject, level } = State.ui.quick; const kw = document.getElementById("quick-kw").value.trim(); const selIds = State.ui.quick.selectedIds;
    if(!kw) return UI.toast("키워드나 요약 내용을 입력하세요.", "error");
    selIds.forEach(id => { const st = State.students.find(s=>s.id===id); if(st) { if(!st.records) st.records = []; st.records.unshift({ id: generateId(), type, subject, level, keywords: kw, date: Date.now() }); } });
    State.save(); UI.toast(`${selIds.length}명 기록 저장 성공!`); document.getElementById("quick-kw").value = ""; State.ui.quick.selectedIds = []; UI.renderQuickStudentList();
  },

  async handleAIPhotoUpload(event) {
    if(State.students.length === 0) {
      event.target.value = '';
      return UI.toast("먼저 명단을 추가해주세요!", "error");
    }
    const file = event.target.files[0];
    if (!file) return;
    UI.showLoader("AI가 사진 내용을 분석하여 채점 중입니다...");
    try {
      const base64Data = await new Promise((resolve) => {
        const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = () => resolve(reader.result.split(',')[1]);
      });
      const aiData = await API.analyzePhoto(base64Data, file.type);
      UI.closeModal();

      if (aiData) {
        const targetStudent = State.students.find(s => (aiData.name && s.name.includes(aiData.name)) || (aiData.studentId && formatHakbun(s).replace(/\s/g, '').includes(aiData.studentId)));
        if (targetStudent) {
          State.ui.quick.selectedIds = [targetStudent.id]; UI.renderQuickStudentList();
          document.getElementById("quick-kw").value = `[AI 자동채점/분석]\n${aiData.summary || "내용 추출 실패"}`;
          UI.toast(`📸 ${targetStudent.name} 학생 인식! AI 평가가 작성되었습니다.`, "ok");
        } else {
          document.getElementById("quick-kw").value = `[AI 자동채점/분석] 인식된 이름:${aiData.name||'미상'}, 학번:${aiData.studentId||'미상'}\n${aiData.summary || ""}`;
          UI.toast("AI 분석 완료. 학생을 찾지 못했으니 목록에서 선택해주세요.", "warn");
        }
      } else { throw new Error("분석 실패"); }
    } catch (e) { UI.closeModal(); UI.toast("이미지 처리 중 문제가 발생했습니다.", "error"); } finally { event.target.value = ''; }
  },

  saveFinalText(id, type, text) { const st = State.students.find(s=>s.id===id); if(st) { if(!st.finalTexts) st.finalTexts={}; st.finalTexts[type]=text; State.save(); } },
  
  async generateIndividual(id, type, e) {
    const st = State.students.find(s=>s.id===id); const recs = (st.records||[]).filter(r=>r.type===type); if(recs.length===0) return UI.toast("기록이 없습니다.", "warn");
    const btn = e.currentTarget; const orig = btn.innerHTML; btn.innerHTML = "..."; btn.disabled = true;
    try {
      const recordsText = recs.map(r=>`[${r.level}] ${r.keywords}`).join("\n");
      const finalTxt = await API.combineToFinal(type, recordsText);
      this.saveFinalText(id, type, finalTxt); document.getElementById(`ta-${id}`).value = finalTxt; UI.toast("생성 완료!");
    } catch(err) { UI.toast("생성 실패", "error"); } finally { btn.innerHTML = orig; btn.disabled = false; UI.renderReviewList(); }
  },

  async generateBatchEmpty() {
    const type = document.getElementById("rev-type").value;
    const target = State.students.filter(s => !(s.finalTexts && s.finalTexts[type]) && (s.records||[]).some(r=>r.type===type));
    
    if(target.length === 0) return UI.toast("생성할 대상이 없습니다.", "warn");
    
    UI.showLoader("✨ 전체 학생 생기부를 일괄 작성 중입니다...");
    for(let st of target) { 
      const r = st.records.filter(x=>x.type===type); 
      const txt = await API.combineToFinal(type, r.map(x=>x.keywords).join(", ")); 
      if(!st.finalTexts) st.finalTexts={}; 
      st.finalTexts[type]=txt; 
    }
    State.save(); 
    UI.closeModal();
    UI.renderReviewList();
    UI.toast("✨ 일괄 생성이 성공적으로 완료되었습니다!");
  },

  openBatchInspect() {
    if(State.students.length === 0) return UI.toast("점검할 명단이 없습니다.", "warn");
    
    UI.showLoader("AI가 기재 금지어 및 오류를 점검 중입니다...");
    
    setTimeout(() => {
        UI.closeModal();
        let found = false;
        let msg = "";
        
        State.students.forEach(st => {
            Object.values(st.finalTexts || {}).forEach(txt => {
                CONSTANTS.FORBIDDEN.forEach(forbiddenWord => {
                    if(txt.includes(forbiddenWord)) { 
                        found = true; 
                        msg += `<b>${st.name}</b> 학생 기록에 금지어 <span style="color:#EF4444; font-weight:bold;">'${forbiddenWord}'</span> 발견<br>`; 
                    }
                });
            });
        });
        
        if(found) {
            UI.showModal(`
              <div class="card" style="width:90%;max-width:400px;padding:24px;">
                <h3 style="margin-bottom:12px; font-weight:900; color:#EF4444; display:flex; align-items:center; gap:8px;">⚠️ 점검 결과: 수정 필요</h3>
                <div style="margin-top:12px; font-size:14px; line-height:1.6; background:#FEF2F2; padding:16px; border-radius:8px; border:1px solid #FCA5A5;">
                  ${msg}
                </div>
                <p style="margin-top:16px; font-size:13px; color:#6B7280;">문제가 된 부분을 찾아 수기로 수정해주세요.</p>
                <button class="btn-primary" style="width:100%;margin-top:16px;" onclick="UI.closeModal()">확인</button>
              </div>
            `);
        } else {
            UI.showModal(`
              <div class="card" style="width:90%;max-width:400px;padding:24px;text-align:center;">
                <div style="font-size:40px;margin-bottom:12px;">✅</div>
                <h3 style="margin-bottom:8px; font-weight:900;">점검 완료</h3>
                <p style="font-size:14px;color:#4B5563;">작성된 생기부에 기재 금지어 및 형식 오류가 발견되지 않았습니다. 완벽합니다!</p>
                <button class="btn-primary" style="width:100%;margin-top:20px;" onclick="UI.closeModal()">확인</button>
              </div>
            `);
        }
    }, 1500);
  },

  addStudentManual() {
    const raw = document.getElementById("add-raw").value.trim(); const match = raw.match(/^(\d+)\s*(.+)$/); if(!match) return UI.toast("형식 오류 (예: 10101 홍길동)", "error");
    State.students.push({ id: generateId(), name: match[2], grade: match[1][0], classNum: match[1][1], num: match[1].substring(2), records: [], finalTexts: {} });
    State.save(); UI.renderGlobalDropdowns(); UI.closeModal(); UI.renderQuickStudentList(); UI.toast("추가 완료!");
  },
  
  downloadExcel() {
    if (State.students.length === 0) return UI.toast("명단이 없습니다.", "warn");
    const exportData = [["학년", "반", "번호", "이름", "자율활동", "동아리활동", "진로활동", "세특(사회/전체)", "행동특성"]];
    State.students.forEach(st => {
      exportData.push([
        st.grade || "", st.classNum || "", st.num || "", st.name || "",
        st.finalTexts?.["자율"] || "", st.finalTexts?.["동아리"] || "",
        st.finalTexts?.["진로"] || "", st.finalTexts?.["세특"] || "", st.finalTexts?.["행발"] || ""
      ]);
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(exportData);
    XLSX.utils.book_append_sheet(wb, ws, "생기부 데이터");
    XLSX.writeFile(wb, "기록의결_생기부_완성본.xlsx");
    UI.toast("📥 나이스 업로드용 엑셀이 다운로드되었습니다.");
  },

  handleUpload(e) {
    const file = e.target.files[0]; const reader = new FileReader();
    reader.onload = (evt) => {
      const data = XLSX.utils.sheet_to_json(XLSX.read(evt.target.result, { type: 'binary' }).Sheets[XLSX.read(evt.target.result, { type: 'binary' }).SheetNames[0]]);
      data.forEach(r => State.students.push({ id: generateId(), name: r['이름'], grade: String(r['학년']), classNum: String(r['반']), num: String(r['번호']), records: [], finalTexts: {} }));
      State.save(); UI.renderGlobalDropdowns(); UI.renderQuickStudentList(); UI.toast("명단 업로드 완료!");
    }; reader.readAsBinaryString(file);
  }
};

window.onload = () => {
    try {
        App.init();
    } catch (error) {
        console.error("앱 초기화 오류:", error);
        alert("일시적인 오류가 발생했습니다. 페이지를 새로고침 해주세요.");
    }
};
</script>
</body>
